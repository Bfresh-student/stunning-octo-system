services:
  # Service 1 : Application PHP / Apache
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boutique_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      DB_HOST: db
      DB_NAME: boutique
      DB_USER: root
      DB_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - boutique_network

  # Service 2 : Base de données MySQL
  db:
    image: mysql:8.0
    container_name: boutique_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: boutique
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - boutique_network

  # Service 3 : Interface phpMyAdmin (optionnel, pour gérer la BDD graphiquement)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: boutique_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - boutique_network

volumes:
  db_data:
    driver: local

networks:
  boutique_network:
    driver: bridge

